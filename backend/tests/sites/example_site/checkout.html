<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Checkout - Demo Supply Co.</title><script src="site.js"></script></head>
<body data-page="checkout"><nav id="hdr"></nav><main id="main"><h1>Checkout</h1><h2>Shipping address</h2>
<form id="ship">
<label for="name">Full name</label> <input id="name" name="name" autocomplete="name" required><br>
<label for="email">Email</label> <input id="email" name="email" type="email" autocomplete="email" required><br>
<label for="phone">Phone</label> <input id="phone" name="phone" type="tel" autocomplete="tel"><br>
<label for="address1">Street address</label> <input id="address1" name="address1" autocomplete="address-line1" required><br>
<label for="city">City</label> <input id="city" name="city" autocomplete="address-level2" required><br>
<label for="state">State</label> <input id="state" name="state" autocomplete="address-level1" required><br>
<label for="zip">ZIP code</label> <input id="zip" name="zip" autocomplete="postal-code" required><br>
<button id="continue">Continue to payment</button>
</form></main></body></html>
