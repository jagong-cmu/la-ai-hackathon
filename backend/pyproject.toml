[project]
name = "supplier-agent-backend"
version = "0.1.0"
description = "Backend for the LA Hacks 2026 supplier agent: orchestrator, contracts, Jev decisions, plain-code stages."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "sentry-sdk[fastapi]>=2.10",
  "pulp>=2.8,<4",  # 4.0.1 imports numpy without declaring it
]

[project.optional-dependencies]
# Live browser lanes (app/lanes/live). The core server and tests run without them.
browser = [
  "browser-use>=0.9",
  "playwright>=1.45",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008", "ASYNC109"]
